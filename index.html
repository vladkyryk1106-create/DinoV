<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Dino Game SHOP</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(#dff3ff, #ffffff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#container {
    text-align: center;
}

canvas {
    border: 2px solid black;
    background: white;
}

button {
    margin: 5px;
    padding: 8px 12px;
}

.bought {
    background: green;
    color: white;
}

#mobileControls {
    display: none;
}
</style>
</head>

<body>

<div id="container">

<div id="menu">
    <h2>Dino Game 🦖</h2>

    <button onclick="chooseMode('pc')">ПК</button>
    <button onclick="chooseMode('mobile')">Телефон</button><br>

    <button onclick="startGame()">Грати</button>
    <button onclick="openShop()">Магазин</button>
</div>

<div id="shop" style="display:none;">
    <h3>Магазин</h3>

    <p>Фон синій - 50</p>
    <button id="bg1" onclick="buyItem('bg1',50)">Купити</button>

    <p>Скін темний - 50</p>
    <button id="skin1" onclick="buyItem('skin1',50)">Купити</button>

    <br><button onclick="closeShop()">Назад</button>
</div>

<canvas id="game" width="800" height="200" style="display:none;"></canvas>

<div id="mobileControls">
    <button ontouchstart="jump()">⬆️</button>
    <button ontouchstart="duck(true)" ontouchend="duck(false)">⬇️</button>
</div>

<div id="score"></div>
<div id="coins"></div>

</div>

<script>
let canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");

let mode = "pc";
let coins = localStorage.getItem("coins") || 0;

let dino, obstacles, score, gameOver;

// режим
function chooseMode(m) {
    mode = m;
    alert("Режим: " + m);
}

// магазин
function openShop() {
    document.getElementById("menu").style.display = "none";
    document.getElementById("shop").style.display = "block";
    updateShop();
}

function closeShop() {
    document.getElementById("shop").style.display = "none";
    document.getElementById("menu").style.display = "block";
}

// покупка
function buyItem(name, price) {
    if (localStorage.getItem(name)) return;

    if (coins >= price) {
        coins -= price;
        localStorage.setItem("coins", coins);
        localStorage.setItem(name, "true");
        updateShop();
    } else {
        alert("Не вистачає монет");
    }
}

function updateShop() {
    document.getElementById("coins").innerText = "Coins: " + coins;

    ["bg1","skin1"].forEach(id => {
        if (localStorage.getItem(id)) {
            let btn = document.getElementById(id);
            btn.innerText = "КУПЛЕНО";
            btn.classList.add("bought");
        }
    });
}

// гра
function startGame() {
    document.getElementById("menu").style.display = "none";
    canvas.style.display = "block";

    if (mode === "mobile") {
        document.getElementById("mobileControls").style.display = "block";
    }

    dino = { x: 50, y:150, dy:0, grounded:true };
    obstacles = [];
    score = 0;
    gameOver = false;

    loop();
}

function jump() {
    if (dino.grounded) {
        dino.dy = -10;
        dino.grounded = false;
    }
}

function duck(val) {
    dino.duck = val;
}

document.addEventListener("keydown", e=>{
    if(e.key==="ArrowUp") jump();
    if(e.key==="ArrowDown") duck(true);
});

document.addEventListener("keyup", e=>{
    if(e.key==="ArrowDown") duck(false);
});

function spawnObstacle() {
    obstacles.push({x:800,y:160,w:20,h:40});
}

function update() {
    if (gameOver) return;

    dino.y += dino.dy;
    dino.dy += 0.5;

    if (dino.y>=150){
        dino.y=150;
        dino.dy=0;
        dino.grounded=true;
    }

    if (Math.random()<0.02) spawnObstacle();

    obstacles.forEach((o,i)=>{
        o.x-=5;

        if (50<o.x+o.w && 80>o.x && dino.y+30>o.y){
            gameOver=true;

            coins++;
            localStorage.setItem("coins", coins);
        }

        if(o.x<-50) obstacles.splice(i,1);
    });

    score++;
    document.getElementById("score").innerText="Score: "+score;
    document.getElementById("coins").innerText="Coins: "+coins;
}

function draw() {
    ctx.clearRect(0,0,800,200);

    // фон
    if (localStorage.getItem("bg1")) {
        ctx.fillStyle = "#aaddff";
        ctx.fillRect(0,0,800,200);
    }

    // земля
    ctx.fillRect(0,180,800,2);

    // дінозавр
    ctx.fillStyle = localStorage.getItem("skin1") ? "#111" : "#444";
    ctx.fillRect(50,dino.y,30,30);

    obstacles.forEach(o=>{
        ctx.fillRect(o.x,o.y,o.w,o.h);
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// старт
updateShop();
</script>

</body>
</html>
