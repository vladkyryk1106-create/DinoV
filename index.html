<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Dino Game ULTRA+</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(#dff3ff, #ffffff);
  font-family: Arial, sans-serif;
}
#gameContainer { text-align: center; max-width: 860px; width: 100%; padding: 16px; }
h1 { margin: 0 0 10px; font-size: 26px; color: #222; }
#coinDisplay {
  display: inline-flex; align-items: center; gap: 6px;
  background: #fff8e1; border: 1.5px solid #f0c040; border-radius: 20px;
  padding: 4px 16px; font-weight: bold; font-size: 16px; color: #a07000; margin-bottom: 12px;
}
#shopWrapper { overflow: hidden; max-height: 0; opacity: 0; transition: max-height 0.35s ease, opacity 0.3s ease; }
#shopWrapper.open { max-height: 500px; opacity: 1; }
#shop { background:#fff; border:2px solid #ddd; border-radius:10px; padding:16px; margin-bottom:12px; text-align:left; }
#shop h3 { margin:0 0 10px; }
#shop h4 { margin:8px 0 6px; font-size:14px; color:#555; }
.btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
.skin-btn, .bg-btn {
  padding:6px 14px; border:1.5px solid #ccc; border-radius:6px;
  background:#f9f9f9; cursor:pointer; font-size:14px;
  display:flex; align-items:center; gap:6px; transition:0.15s;
}
.skin-btn.active, .bg-btn.active { border:2.5px solid #6c47ff; background:#f0ebff; font-weight:bold; }
.price-tag { color:#a07000; font-size:12px; }
.skin-dot { display:inline-block; width:14px; height:14px; border-radius:3px; border:1px solid #aaa; }
#promoInput { padding:6px 10px; border:1.5px solid #ccc; border-radius:6px; font-size:14px; }
#promoBtn { padding:6px 14px; background:#22aa44; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
#promoRow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
#promoMsg { font-weight:bold; }
button { transition:0.15s; }
button:hover { opacity:0.88; }
.btn-shop { padding:8px 20px; background:#6c47ff; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold; font-size:15px; margin-bottom:10px; }
.card { background:#fff; border:2px solid #ddd; border-radius:12px; padding:20px; margin-bottom:12px; }
.hint { color:#555; margin:0 0 14px; }
.level-wrap { display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap; }
#levelSelect { padding:6px 10px; border-radius:6px; border:1.5px solid #ccc; font-size:14px; }
.btn-play { padding:10px 28px; background:#6c47ff; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold; font-size:16px; }
.go-title { color:#cc2222; margin:0 0 8px; }
.go-row { display:flex; gap:10px; justify-content:center; margin-top:14px; }
.btn-retry { padding:10px 24px; background:#6c47ff; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold; font-size:15px; }
.btn-menu { padding:10px 24px; background:#eee; border:1.5px solid #ccc; border-radius:8px; cursor:pointer; font-weight:bold; font-size:15px; }
canvas { border:2px solid #333; border-radius:6px; max-width:100%; cursor:pointer; display:block; margin:0 auto; }
#scoreBar { margin-top:8px; font-weight:bold; font-size:16px; display:none; }
#mobileControls { display:none; gap:12px; justify-content:center; margin-top:12px; }
.btn-mobile { padding:14px 32px; color:#fff; border:none; border-radius:10px; cursor:pointer; font-weight:bold; font-size:18px; user-select:none; }
.btn-jump { background:#6c47ff; }
.btn-duck { background:#555; }
</style>
</head>
<body>
<div id="gameContainer">
  <h1>🦖 Dino Game ULTRA+</h1>
  <div id="coinDisplay">🪙 <span id="coinCount">0</span> монет</div><br>
  <button class="btn-shop" onclick="toggleShop()">🛒 Магазин</button>
  <div id="shopWrapper">
    <div id="shop">
      <h3>Магазин</h3>
      <h4>Скіни діно:</h4>
      <div class="btn-row">
        <button class="skin-btn" id="skin-black" onclick="buySkin('black',0)"><span class="skin-dot" style="background:#222"></span> Чорний</button>
        <button class="skin-btn" id="skin-green" onclick="buySkin('green',50)"><span class="skin-dot" style="background:#22aa44"></span> Зелений <span class="price-tag">(50🪙)</span></button>
        <button class="skin-btn" id="skin-red"   onclick="buySkin('red',100)"><span class="skin-dot" style="background:#cc2222"></span> Червоний <span class="price-tag">(100🪙)</span></button>
      </div>
      <h4>Фони:</h4>
      <div class="btn-row">
        <button class="bg-btn" id="bg-day"    onclick="buyBg('day',0)">☀️ День</button>
        <button class="bg-btn" id="bg-desert" onclick="buyBg('desert',80)">🏜️ Пустеля <span class="price-tag">(80🪙)</span></button>
        <button class="bg-btn" id="bg-forest" onclick="buyBg('forest',120)">🌲 Ліс <span class="price-tag">(120🪙)</span></button>
      </div>
      <hr style="margin:10px 0;border-color:#eee">
      <strong>Промокод:</strong>
      <div id="promoRow">
        <input id="promoInput" placeholder="Введи код..." onkeydown="if(event.key==='Enter')usePromo()">
        <button id="promoBtn" onclick="usePromo()">Застосувати</button>
        <span id="promoMsg"></span>
      </div>
    </div>
  </div>
  <div class="card" id="menuCard">
    <p class="hint">⬆️ Стрибок &nbsp;|&nbsp; ⬇️ Присісти &nbsp;|&nbsp; Shift — прискорення</p>
    <div class="level-wrap">
      <label><strong>Рівень:</strong>&nbsp;
        <select id="levelSelect">
          <option value="easy">Легкий</option>
          <option value="medium">Середній</option>
          <option value="hard">Складний</option>
        </select>
      </label>
      <button class="btn-play" onclick="startGame()">▶ Грати</button>
    </div>
  </div>
  <div class="card" id="gameOverCard" style="display:none">
    <h2 class="go-title">💀 Гру закінчено!</h2>
    <p>Рахунок: <strong id="finalScore">0</strong></p>
    <p style="color:#a07000">+<span id="earnedCoins">0</span> 🪙 монет зароблено</p>
    <div class="go-row">
      <button class="btn-retry" onclick="startGame()">🔄 Грати ще раз</button>
      <button class="btn-menu"  onclick="showMenu()">🏠 Меню</button>
    </div>
  </div>
  <canvas id="game" width="800" height="200"></canvas>
  <div id="scoreBar">Рахунок: <span id="scoreLive">0</span></div>
  <div id="mobileControls">
    <button class="btn-mobile btn-jump" onpointerdown="jump()">⬆ Стрибок</button>
    <button class="btn-mobile btn-duck" onpointerdown="dino&&(dino.duck=true)" onpointerup="dino&&(dino.duck=false)" onpointerleave="dino&&(dino.duck=false)">⬇ Присісти</button>
  </div>
</div>
<script>
const CANVAS_W=800,CANVAS_H=200,GROUND_Y=150;
const SPEED_MAP={easy:4,medium:6,hard:9};
const SKIN_COLORS={black:"#222",green:"#22aa44",red:"#cc2222"};
function load(k,d){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch{return d;}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v));}
let coins=load("coins",0),currentBg=load("bg","day"),currentSkin=load("skin","black");
let ownedBgs=load("ownedBg",["day"]),ownedSkins=load("ownedSkins",["black"]),usedPromos=load("usedPromos",[]);
let dino,obstacles,frame,score,gameOver,rafId,speed,baseSpeed,running=false;
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
canvas.style.display="none";
canvas.onclick=()=>jump();
function refreshUI(){
  document.getElementById("coinCount").textContent=coins;
  ["black","green","red"].forEach(s=>{
    const b=document.getElementById("skin-"+s);
    b.classList.toggle("active",s===currentSkin);
    const p=b.querySelector(".price-tag");
    if(p)p.style.display=ownedSkins.includes(s)?"none":"";
  });
  ["day","desert","forest"].forEach(b=>{
    const el=document.getElementById("bg-"+b);
    el.classList.toggle("active",b===currentBg);
    const p=el.querySelector(".price-tag");
    if(p)p.style.display=ownedBgs.includes(b)?"none":"";
  });
}
refreshUI();
function toggleShop(){document.getElementById("shopWrapper").classList.toggle("open");}
function buySkin(skin,price){
  if(!ownedSkins.includes(skin)){
    if(coins<price){showPromoMsg("Недостатньо монет!","#cc2222");return;}
    coins-=price;ownedSkins.push(skin);save("ownedSkins",ownedSkins);save("coins",coins);
  }
  currentSkin=skin;save("skin",skin);refreshUI();
}
function buyBg(bg,price){
  if(!ownedBgs.includes(bg)){
    if(coins<price){showPromoMsg("Недостатньо монет!","#cc2222");return;}
    coins-=price;ownedBgs.push(bg);save("ownedBg",ownedBgs);save("coins",coins);
  }
  currentBg=bg;save("bg",bg);refreshUI();
}
function usePromo(){
  const code=document.getElementById("promoInput").value.trim();
  if(!code)return;
  if(usedPromos.includes(code)){showPromoMsg("Код вже використано!","#cc2222");return;}
  let bonus=0;
  if(code==="7В")bonus=100;
  else if(code==="Nasklio")bonus=9999;
  else{showPromoMsg("Невірний код!","#cc2222");return;}
  usedPromos.push(code);save("usedPromos",usedPromos);
  coins+=bonus;save("coins",coins);refreshUI();
  showPromoMsg("+"+bonus+" монет! 🎉","#22aa44");
  document.getElementById("promoInput").value="";
}
function showPromoMsg(t,c){const e=document.getElementById("promoMsg");e.textContent=t;e.style.color=c;}
function drawBg(){
  if(currentBg==="day"){ctx.fillStyle="#dff3ff";ctx.fillRect(0,0,CANVAS_W,CANVAS_H);}
  else if(currentBg==="desert"){ctx.fillStyle="#f4d29c";ctx.fillRect(0,0,CANVAS_W,CANVAS_H);ctx.fillStyle="#e0b878";ctx.fillRect(0,GROUND_Y+30,CANVAS_W,CANVAS_H-GROUND_Y-30);}
  else if(currentBg==="forest"){ctx.fillStyle="#87c77b";ctx.fillRect(0,0,CANVAS_W,CANVAS_H);for(let i=0;i<CANVAS_W;i+=100){ctx.fillStyle="#8b5a2b";ctx.fillRect(i,120,10,60);ctx.fillStyle="#2e8b57";ctx.beginPath();ctx.arc(i+5,110,25,0,Math.PI*2);ctx.fill();}}
  ctx.fillStyle="#333";ctx.fillRect(0,GROUND_Y+30,CANVAS_W,2);
}
function drawDino(){
  const h=dino.duck?15:30,y=dino.duck?dino.y+15:dino.y;
  ctx.fillStyle=SKIN_COLORS[currentSkin];ctx.fillRect(dino.x,y,30,h);
  if(!dino.duck){ctx.fillStyle="#fff";ctx.fillRect(dino.x+22,y+4,6,6);ctx.fillStyle="#000";ctx.fillRect(dino.x+24,y+6,3,3);}
}
function jump(){if(dino&&dino.grounded&&!gameOver){dino.dy=dino.jump;dino.grounded=false;}}
function startGame(){
  cancelAnimationFrame(rafId);
  baseSpeed=SPEED_MAP[document.getElementById("levelSelect").value];
  speed=baseSpeed;running=false;
  dino={x:60,y:GROUND_Y,dy:0,gravity:0.6,jump:-12,grounded:true,duck:false};
  obstacles=[];frame=0;score=0;gameOver=false;
  document.getElementById("menuCard").style.display="none";
  document.getElementById("gameOverCard").style.display="none";
  canvas.style.display="block";
  document.getElementById("scoreBar").style.display="block";
  document.getElementById("mobileControls").style.display="flex";
  rafId=requestAnimationFrame(loop);
}
function showMenu(){
  cancelAnimationFrame(rafId);
  canvas.style.display="none";
  document.getElementById("scoreBar").style.display="none";
  document.getElementById("mobileControls").style.display="none";
  document.getElementById("gameOverCard").style.display="none";
  document.getElementById("menuCard").style.display="block";
}
document.addEventListener("keydown",e=>{
  if(!dino)return;
  if((e.key==="ArrowUp"||e.key===" ")&&dino.grounded&&!gameOver)jump();
  if(e.key==="ArrowDown")dino.duck=true;
  if(e.key==="Shift")running=true;
});
document.addEventListener("keyup",e=>{
  if(!dino)return;
  if(e.key==="ArrowDown")dino.duck=false;
  if(e.key==="Shift")running=false;
});
function loop(){
  if(!gameOver){
    frame++;
    dino.y+=dino.dy;dino.dy+=dino.gravity;
    if(dino.y>=GROUND_Y){dino.y=GROUND_Y;dino.dy=0;dino.grounded=true;}
    if(frame%90===0)obstacles.push({x:CANVAS_W,y:GROUND_Y-10,w:20,h:40});
    speed=baseSpeed+Math.floor(frame/600)*0.5;
    if(running)speed+=3;
    for(let i=obstacles.length-1;i>=0;i--){
      obstacles[i].x-=speed;
      if(obstacles[i].x<-60){obstacles.splice(i,1);continue;}
      const o=obstacles[i],dh=dino.duck?15:30,dy=dino.duck?dino.y+15:dino.y,mg=4;
      if(dino.x+30-mg>o.x+mg&&dino.x+mg<o.x+o.w-mg&&dy+dh-mg>o.y+mg&&dy+mg<o.y+o.h-mg){
        gameOver=true;
        const earned=Math.floor(score/10);coins+=earned;save("coins",coins);refreshUI();
        document.getElementById("finalScore").textContent=score;
        document.getElementById("earnedCoins").textContent=earned;
        document.getElementById("gameOverCard").style.display="block";
        document.getElementById("mobileControls").style.display="none";
        break;
      }
    }
    score++;document.getElementById("scoreLive").textContent=score;
  }
  drawBg();
  ctx.fillStyle="#555";obstacles.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));
  drawDino();
  ctx.fillStyle="#333";ctx.font="bold 14px Arial";ctx.fillText("Score: "+score,10,18);
  if(!gameOver)rafId=requestAnimationFrame(loop);
}
</script>
</body>
</html>
