<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Dino Game ULTRA+</title>

<style>
body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(#dff3ff, #ffffff);
    font-family: Arial;
}

#gameContainer {
    text-align: center;
}

canvas {
    border: 2px solid #333;
}

#topBar {
    margin-bottom: 10px;
}

#topBar button, select {
    margin: 3px;
    padding: 6px 10px;
}

#shop {
    display: none;
    background: white;
    border: 2px solid black;
    padding: 10px;
    margin-top: 10px;
}

#shop.active {
    display: block;
}

.bought {
    background: green;
    color: white;
}

#mobileControls {
    display: none;
    margin-top: 10px;
}
</style>
</head>

<body>

<div id="gameContainer">

<div id="topBar">
    <button onclick="showMenu()">🏠 Home</button>
    <button onclick="restartGame()">🔁 Restart</button>

    <select id="level">
        <option value="easy">Легкий</option>
        <option value="medium">Середній</option>
        <option value="hard">Складний</option>
    </select>

    <select id="mode">
        <option value="pc">ПК</option>
        <option value="mobile">Телефон</option>
    </select>

    <button onclick="startGame()">▶ Play</button>
    <button onclick="toggleShop()">🛒 Магазин</button>
</div>

<div id="coins"></div>

<div id="shop">
    <h3>Магазин</h3>

    <h4>Скіни</h4>
    <button id="skin_black" onclick="buySkin('black',0)">Чорний</button>
    <button id="skin_green" onclick="buySkin('green',50)">Зелений</button>
    <button id="skin_red" onclick="buySkin('red',100)">Червоний</button>

    <h4>Фони</h4>
    <button id="bg_day" onclick="buyBg('day',0)">День</button>
    <button id="bg_desert" onclick="buyBg('desert',80)">Пустеля</button>
    <button id="bg_forest" onclick="buyBg('forest',120)">Ліс</button>

    <hr>

    <input id="promoInput" placeholder="код">
    <button onclick="usePromo()">OK</button>
</div>

<canvas id="game" width="800" height="200" style="display:none;"></canvas>

<div id="mobileControls">
    <button ontouchstart="jump()">⬆️</button>
    <button ontouchstart="duck(true)" ontouchend="duck(false)">⬇️</button>
</div>

<div id="score"></div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let speedMap = { easy: 4, medium: 6, hard: 9 };
let speed, baseSpeed;

let dino, obstacles;
let frame, score, gameOver;
let mode = "pc";

/* 💾 */
let coins = parseInt(localStorage.getItem("coins")) || 0;
let currentBg = localStorage.getItem("bg") || "day";
let currentSkin = localStorage.getItem("skin") || "black";
let ownedBg = JSON.parse(localStorage.getItem("ownedBg")) || ["day"];
let ownedSkins = JSON.parse(localStorage.getItem("ownedSkins")) || ["black"];

function updateCoins(){
    document.getElementById("coins").innerText = "Coins: " + coins;
}
updateCoins();

/* 🛒 */
function toggleShop() {
    document.getElementById("shop").classList.toggle("active");
}

function buySkin(skin, price) {
    if (!ownedSkins.includes(skin)) {
        if (coins < price) return;
        coins -= price;
        ownedSkins.push(skin);
    }
    currentSkin = skin;
    save();
    updateShopUI();
}

function buyBg(bg, price) {
    if (!ownedBg.includes(bg)) {
        if (coins < price) return;
        coins -= price;
        ownedBg.push(bg);
    }
    currentBg = bg;
    save();
    updateShopUI();
}

function save() {
    localStorage.setItem("coins", coins);
    localStorage.setItem("bg", currentBg);
    localStorage.setItem("skin", currentSkin);
    localStorage.setItem("ownedBg", JSON.stringify(ownedBg));
    localStorage.setItem("ownedSkins", JSON.stringify(ownedSkins));
    updateCoins();
}

function updateShopUI(){
    document.querySelectorAll("button").forEach(btn=>{
        if(btn.id.startsWith("skin_")){
            let s = btn.id.replace("skin_","");
            if(ownedSkins.includes(s)){
                btn.innerText = "КУПЛЕНО";
                btn.classList.add("bought");
            }
        }
        if(btn.id.startsWith("bg_")){
            let b = btn.id.replace("bg_","");
            if(ownedBg.includes(b)){
                btn.innerText = "КУПЛЕНО";
                btn.classList.add("bought");
            }
        }
    });
}
updateShopUI();

/* 🎮 */
function startGame() {
    baseSpeed = speedMap[document.getElementById("level").value];
    speed = baseSpeed;
    mode = document.getElementById("mode").value;

    canvas.style.display = "block";

    document.getElementById("mobileControls").style.display =
        (mode === "mobile") ? "block" : "none";

    dino = {
        x: 60,
        y: 150,
        dy: 0,
        gravity: 0.6,
        jump: -11,
        grounded: true,
        duck: false
    };

    obstacles = [];
    frame = 0;
    score = 0;
    gameOver = false;
}

/* 🔁 */
function restartGame(){
    startGame();
}

function showMenu(){
    canvas.style.display = "none";
    gameOver = false;
}

/* керування */
function jump(){
    if(dino && dino.grounded){
        dino.dy = dino.jump;
        dino.grounded = false;
    }
}

function duck(v){
    if(dino) dino.duck = v;
}

document.addEventListener("keydown", e=>{
    if(!dino) return;
    if(e.key==="ArrowUp") jump();
    if(e.key==="ArrowDown") duck(true);
});

document.addEventListener("keyup", e=>{
    if(e.key==="ArrowDown") duck(false);
});

/* obstacle */
function spawnObstacle(){
    obstacles.push({x:800,y:160,w:20,h:40});
}

/* update */
function update(){
    if(!dino || gameOver) return;

    frame++;

    dino.y += dino.dy;
    dino.dy += dino.gravity;

    if(dino.y>=150){
        dino.y=150;
        dino.dy=0;
        dino.grounded=true;
    }

    if(frame%90===0) spawnObstacle();

    obstacles.forEach((o,i)=>{
        o.x -= speed;

        let h = dino.duck ? 15 : 30;
        let y = dino.duck ? dino.y+15 : dino.y;

        if(60<o.x+o.w && 90>o.x && y<o.y+o.h && y+h>o.y){
            gameOver = true;
            coins += Math.floor(score/10);
            save();
        }

        if(o.x<-50) obstacles.splice(i,1);
    });

    score++;
    document.getElementById("score").innerText = "Score: "+score;
}

/* 🎨 */
function drawBg(){
    if(currentBg==="day"){
        ctx.fillStyle="#dff3ff";
        ctx.fillRect(0,0,800,200);
    }
    if(currentBg==="desert"){
        ctx.fillStyle="#f4d29c";
        ctx.fillRect(0,0,800,200);
    }
    if(currentBg==="forest"){
        ctx.fillStyle="#87c77b";
        ctx.fillRect(0,0,800,200);
    }
}

function drawDino(){
    ctx.fillStyle=currentSkin;
    ctx.fillRect(60, dino.duck?dino.y+15:dino.y,30,dino.duck?15:30);
}

/* draw */
function draw(){
    ctx.clearRect(0,0,800,200);

    if(!dino) return;

    drawBg();

    ctx.fillStyle="#000";
    ctx.fillRect(0,180,800,2);

    drawDino();

    obstacles.forEach(o=>{
        ctx.fillRect(o.x,o.y,o.w,o.h);
    });

    if(gameOver){
        ctx.fillText("GAME OVER",300,100);
    }
}

/* loop */
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
