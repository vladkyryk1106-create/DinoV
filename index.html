<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Dino Game ULTRA+</title>

<style>
body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(#dff3ff, #ffffff);
    font-family: Arial;
}

#gameContainer {
    text-align: center;
}

canvas {
    border: 2px solid #333;
    border-radius: 12px;
}

/* верх */
#topBar {
    margin-bottom: 10px;
}

/* кнопки */
button {
    margin: 5px;
    padding: 8px 14px;
    border-radius: 12px;
    border: none;
    background: #4da6ff;
    color: white;
    cursor: pointer;
    transition: 0.25s;
}

button:hover {
    background: #3399ff;
    transform: scale(1.08);
}

button:active {
    transform: scale(0.95);
}

.bought {
    background: #4CAF50 !important;
}

/* магазин */
#shop {
    display: none;
    background: white;
    border-radius: 12px;
    padding: 10px;
    margin-top: 10px;
}

#shop.active {
    display: block;
}

/* моб */
#mobileControls {
    display: none;
    margin-top: 10px;
}
</style>
</head>

<body>

<div id="gameContainer">

<div id="topBar">
    <button onclick="showMenu()">🏠 Home</button>
    <button onclick="toggleShop()">🛒 Shop</button>
    <button onclick="toggleMode()">📱 Mode</button>
    <span id="coins"></span>
</div>

<div id="menu">
    <h2>Dino Game 🦖</h2>
    <button onclick="startGame()">Play</button><br>

    <select id="level">
        <option value="easy">Легкий</option>
        <option value="medium">Середній</option>
        <option value="hard">Складний</option>
    </select>
</div>

<div id="shop">
    <h3>Магазин</h3>

    <h4>Скіни</h4>
    <button id="skin_black" onclick="buySkin('black',0)">Чорний (0)</button>
    <button id="skin_green" onclick="buySkin('green',50)">Зелений (50)</button>
    <button id="skin_red" onclick="buySkin('red',100)">Червоний (100)</button>

    <h4>Фони</h4>
    <button id="bg_day" onclick="buyBg('day',0)">День (0)</button>
    <button id="bg_desert" onclick="buyBg('desert',80)">Пустеля (80)</button>
    <button id="bg_forest" onclick="buyBg('forest',120)">Ліс (120)</button>
</div>

<canvas id="game" width="800" height="200" style="display:none;"></canvas>

<div id="mobileControls">
    <button onclick="jump()">⬆️</button>
    <button onclick="duck(true)">⬇️</button>
</div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let speedMap = { easy: 4, medium: 6, hard: 9 };
let speed, baseSpeed;

let dino, obstacles;
let frame, score, gameOver;

let mobileMode = false;

/* 💾 */
let coins = parseInt(localStorage.getItem("coins")) || 0;
let currentBg = localStorage.getItem("bg") || "day";
let currentSkin = localStorage.getItem("skin") || "black";
let ownedBg = JSON.parse(localStorage.getItem("ownedBg")) || ["day"];
let ownedSkins = JSON.parse(localStorage.getItem("ownedSkins")) || ["black"];

updateCoins();
updateShopUI();

function updateCoins(){
    document.getElementById("coins").innerText = "Coins: " + coins;
}

/* 🛒 */
function toggleShop(){
    document.getElementById("shop").classList.toggle("active");
}

function updateShopUI(){
    ["black","green","red"].forEach(s=>{
        if(ownedSkins.includes(s)){
            document.getElementById("skin_"+s).classList.add("bought");
            document.getElementById("skin_"+s).innerText="КУПЛЕНО";
        }
    });

    ["day","desert","forest"].forEach(b=>{
        if(ownedBg.includes(b)){
            document.getElementById("bg_"+b).classList.add("bought");
            document.getElementById("bg_"+b).innerText="КУПЛЕНО";
        }
    });
}

function buySkin(skin,price){
    if(!ownedSkins.includes(skin)){
        if(coins<price) return;
        coins-=price;
        ownedSkins.push(skin);
    }
    currentSkin=skin;
    save();
}

function buyBg(bg,price){
    if(!ownedBg.includes(bg)){
        if(coins<price) return;
        coins-=price;
        ownedBg.push(bg);
    }
    currentBg=bg;
    save();
}

function save(){
    localStorage.setItem("coins",coins);
    localStorage.setItem("bg",currentBg);
    localStorage.setItem("skin",currentSkin);
    localStorage.setItem("ownedBg",JSON.stringify(ownedBg));
    localStorage.setItem("ownedSkins",JSON.stringify(ownedSkins));
    updateCoins();
    updateShopUI();
}

/* 🎮 */
function startGame(){
    baseSpeed = speedMap[document.getElementById("level").value];
    speed = baseSpeed;

    document.getElementById("menu").style.display="none";
    canvas.style.display="block";

    if(mobileMode) document.getElementById("mobileControls").style.display="block";

    dino = { x:60,y:150,dy:0,gravity:0.6,jump:-11,grounded:true,duck:false };

    obstacles=[];
    frame=0;
    score=0;
    gameOver=false;
}

function showMenu(){
    location.reload();
}

/* керування */
document.addEventListener("keydown",(e)=>{
    if(!dino) return;

    if(e.key==="ArrowUp" && dino.grounded) jump();
    if(e.key==="ArrowDown") duck(true);

    if(gameOver) showMenu();
});

document.addEventListener("keyup",(e)=>{
    if(e.key==="ArrowDown") duck(false);
});

function jump(){
    if(dino.grounded){
        dino.dy=dino.jump;
        dino.grounded=false;
    }
}

function duck(state){
    dino.duck=state;
}

/* obstacle */
function spawnObstacle(){
    obstacles.push({x:800,y:160,w:20,h:40});
}

/* update */
function update(){
    if(gameOver) return;

    frame++;

    dino.y+=dino.dy;
    dino.dy+=dino.gravity;

    if(dino.y>=150){
        dino.y=150;
        dino.dy=0;
        dino.grounded=true;
    }

    if(frame%90===0) spawnObstacle();

    obstacles.forEach((o,i)=>{
        o.x-=speed;

        let h = dino.duck ? 15 : 30;
        let y = dino.duck ? dino.y+15 : dino.y;

        if(60 < o.x+o.w && 90 > o.x && y < o.y+o.h && y+h > o.y){
            gameOver=true;
        }

        if(o.x<-50) obstacles.splice(i,1);
    });

    score++;
}

/* 🌄 фони */
function drawBg(){
    if(currentBg==="day"){
        ctx.fillStyle="#dff3ff";
        ctx.fillRect(0,0,800,200);

        ctx.fillStyle="#ccc";
        ctx.fillRect(100,50,60,20);
        ctx.fillRect(200,30,80,25);
    }

    if(currentBg==="desert"){
        ctx.fillStyle="#f4d29c";
        ctx.fillRect(0,0,800,200);

        ctx.fillStyle="#e0b878";
        ctx.fillRect(0,160,800,40);
    }

    if(currentBg==="forest"){
        ctx.fillStyle="#87c77b";
        ctx.fillRect(0,0,800,200);

        for(let i=0;i<800;i+=120){
            ctx.fillStyle="#8b5a2b";
            ctx.fillRect(i,120,10,60);

            ctx.fillStyle="#2e8b57";
            ctx.beginPath();
            ctx.arc(i+5,110,25,0,Math.PI*2);
            ctx.fill();
        }
    }
}

/* 🦖 динозавр (норм вигляд) */
function drawDino(){
    ctx.fillStyle=currentSkin;

    // тіло
    ctx.fillRect(60, dino.y, 30, 20);

    // голова
    ctx.fillRect(80, dino.y-10, 15, 15);

    // ноги
    ctx.fillRect(60, dino.y+20, 8, 10);
    ctx.fillRect(75, dino.y+20, 8, 10);
}

/* draw */
function draw(){
    drawBg();

    ctx.fillStyle="#000";
    ctx.fillRect(0,180,800,2);

    drawDino();

    obstacles.forEach(o=>{
        ctx.fillRect(o.x,o.y,o.w,o.h);
    });

    if(gameOver){
        ctx.fillText("GAME OVER",300,100);
    }
}

/* loop */
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();

/* режим */
function toggleMode(){
    mobileMode=!mobileMode;
    alert(mobileMode?"Телефон режим":"ПК режим");
}
</script>

</body>
</html>
