<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Game ULTRA+</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;background:linear-gradient(180deg,#dff3ff 0%,#fff 100%);font-family:Arial,sans-serif;padding:20px 0}
#wrap{width:100%;max-width:860px;padding:0 16px;text-align:center}
h1{font-size:26px;color:#222;margin-bottom:12px}
#coins-badge{display:inline-flex;align-items:center;gap:6px;background:#fff8e1;border:1.5px solid #f0c040;border-radius:20px;padding:4px 18px;font-weight:bold;font-size:16px;color:#a07000;margin-bottom:12px}
.top-btns{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
button{cursor:pointer;transition:.15s;font-family:Arial,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:hover{opacity:.88}
.btn-blue{padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:15px}
.btn-purple{padding:8px 18px;background:#6c47ff;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:15px}
.panel{overflow:hidden;max-height:0;opacity:0;transition:max-height .35s ease,opacity .3s ease}
.panel.open{max-height:900px;opacity:1}
.profile-box{background:#fff;border:2px solid #ddd;border-radius:12px;padding:16px;margin-bottom:12px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;text-align:left}
#previewCanvas{border:2px solid #ccc;border-radius:8px;display:block}
.pdata{flex:1;min-width:180px}
.lbl{font-size:12px;color:#888;margin-bottom:2px}
.nick-show{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.nick-val{font-size:20px;font-weight:bold;color:#222}
.btn-edit{padding:3px 10px;background:#f0ebff;border:1.5px solid #6c47ff;border-radius:6px;font-size:13px;color:#6c47ff;font-weight:bold}
.nick-form{display:none;gap:8px;align-items:center;margin-bottom:10px}
#nickInput{padding:5px 10px;border:1.5px solid #6c47ff;border-radius:6px;font-size:16px;width:140px}
.btn-ok{padding:5px 10px;background:#22aa44;color:#fff;border:none;border-radius:6px;font-weight:bold}
.btn-cancel{padding:5px 10px;background:#eee;border:1px solid #ccc;border-radius:6px}
.pid{font-family:monospace;font-size:18px;font-weight:bold;letter-spacing:3px;color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:4px 10px;display:inline-block;margin-bottom:10px}
.shop-box{background:#fff;border:2px solid #ddd;border-radius:10px;padding:16px;margin-bottom:12px;text-align:left}
.shop-box h3{margin-bottom:10px}
.shop-box h4{margin:8px 0 6px;font-size:14px;color:#555}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.sbtn{padding:6px 14px;border:1.5px solid #ccc;border-radius:6px;background:#f9f9f9;font-size:14px;display:flex;align-items:center;gap:6px}
.sbtn.on{border:2.5px solid #6c47ff;background:#f0ebff;font-weight:bold}
.dot{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #aaa}
.ptag{color:#a07000;font-size:12px}
.promo-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
#promoInp{padding:6px 10px;border:1.5px solid #ccc;border-radius:6px;font-size:14px}
#promoBtn{padding:6px 14px;background:#22aa44;color:#fff;border:none;border-radius:6px;font-weight:bold}
#promoMsg{font-weight:bold}
.card{background:#fff;border:2px solid #ddd;border-radius:12px;padding:20px;margin-bottom:12px}
.hint{color:#555;margin-bottom:14px}
.lvl-row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
#lvlSel{padding:6px 10px;border-radius:6px;border:1.5px solid #ccc;font-size:14px}
.btn-play{padding:10px 28px;background:#6c47ff;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:16px}
#goCard{display:none}
.go-title{color:#cc2222;margin-bottom:8px}
.go-btns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.btn-retry{padding:10px 24px;background:#6c47ff;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:15px}
.btn-home{padding:10px 24px;background:#eee;border:1.5px solid #ccc;border-radius:8px;font-weight:bold;font-size:15px}
#gameCanvas{display:none;border:2px solid #333;border-radius:6px;max-width:100%;cursor:pointer;margin:0 auto;display:none}
#scorebar{display:none;margin-top:8px;font-weight:bold;font-size:16px}
#mob{display:none;gap:12px;justify-content:center;margin-top:12px}
.mbtn{padding:14px 32px;color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:18px;user-select:none;-webkit-user-select:none;touch-action:none}
#adminPanel{display:none;position:fixed;top:12px;right:12px;z-index:9999;background:#1a1a2e;color:#eee;border-radius:12px;padding:16px;width:240px;box-shadow:0 4px 24px rgba(0,0,0,.55);border:2px solid #6c47ff;font-size:13px}
.adm-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.adm-title{font-size:15px;font-weight:bold;color:#a78bfa}
.adm-close{background:none;border:none;color:#888;font-size:18px;line-height:1;padding:0}
.adm-stats{background:#0f0f1a;border-radius:8px;padding:8px 10px;margin:10px 0;display:flex;justify-content:space-between}
.adm-s-label{color:#888;font-size:11px}
.adm-s-val{font-size:22px;font-weight:bold}
.vis-val{color:#22d3ee}
.onl-val{color:#4ade80}
.adm-lbl{color:#888;font-size:11px;margin-bottom:4px}
.adm-row{display:flex;gap:4px;margin-bottom:8px}
.adm-inp{flex:1;padding:5px 8px;background:#0f0f1a;border:1px solid #444;border-radius:6px;color:#eee;font-family:monospace;font-size:13px}
.adm-save{padding:5px 10px;border:none;border-radius:6px;font-weight:bold;font-size:12px;cursor:pointer}
.adm-sid{background:#6c47ff;color:#fff}
.adm-scoin{background:#22aa44;color:#fff}
.adm-foot{color:#555;font-size:10px;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div id="adminPanel">
  <div class="adm-head">
    <span class="adm-title">🛡️ Адмін-панель</span>
    <button class="adm-close" onclick="closeAdmin()">✕</button>
  </div>
  <div class="adm-stats">
    <div><div class="adm-s-label">Відвідувань</div><div class="adm-s-val vis-val" id="aVis">0</div></div>
    <div style="text-align:right"><div class="adm-s-label">Онлайн</div><div class="adm-s-val onl-val" id="aOnl">1</div></div>
  </div>
  <div class="adm-lbl">ID ГРАВЦЯ</div>
  <div class="adm-row">
    <input class="adm-inp" id="aId" maxlength="10" placeholder="10 цифр" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)">
    <button class="adm-save adm-sid" onclick="adminSaveId()">✓</button>
  </div>
  <div class="adm-lbl">МОНЕТИ</div>
  <div class="adm-row">
    <input class="adm-inp" id="aCoin" type="number" min="0" placeholder="0">
    <button class="adm-save adm-scoin" onclick="adminSaveCoins()">✓</button>
  </div>
  <div class="adm-foot">Dino Game ULTRA+ Admin</div>
</div>

<div id="wrap">
  <h1>🦖 Dino Game ULTRA+</h1>
  <div id="coins-badge">🪙 <span id="coinsEl">0</span> монет</div><br>

  <div class="top-btns">
    <button class="btn-blue" onclick="toggleProfile()">👤 Профіль</button>
    <button class="btn-purple" onclick="toggleShop()">🛒 Магазин</button>
  </div>

  <!-- ПРОФІЛЬ -->
  <div class="panel" id="profilePanel">
    <div class="profile-box">
      <div>
        <canvas id="previewCanvas" width="200" height="100"></canvas>
        <div id="prevLabel" style="margin-top:4px;font-size:12px;color:#888;text-align:center"></div>
      </div>
      <div class="pdata">
        <div class="lbl">Нік гравця</div>
        <div class="nick-show" id="nickShow">
          <span class="nick-val" id="nickVal"></span>
          <button class="btn-edit" onclick="startEditNick()">✏️ Змінити</button>
        </div>
        <div class="nick-form" id="nickForm">
          <input id="nickInput" maxlength="20" onkeydown="if(event.key==='Enter')saveNick()">
          <button class="btn-ok" onclick="saveNick()">✓</button>
          <button class="btn-cancel" onclick="cancelNick()">✕</button>
        </div>
        <div class="lbl">ID гравця</div>
        <div class="pid" id="pidEl"></div>
        <div class="lbl" style="margin-top:6px">Монети</div>
        <div style="font-size:16px;font-weight:bold;color:#a07000">🪙 <span id="profCoins">0</span></div>
      </div>
    </div>
  </div>

  <!-- МАГАЗИН -->
  <div class="panel" id="shopPanel">
    <div class="shop-box">
      <h3>Магазин</h3>
      <h4>Скіни діно:</h4>
      <div class="btn-row">
        <button class="sbtn" id="sk-black" onclick="buySkin('black',0)"><span class="dot" style="background:#222"></span>Чорний</button>
        <button class="sbtn" id="sk-green" onclick="buySkin('green',50)"><span class="dot" style="background:#22aa44"></span>Зелений<span class="ptag">(50🪙)</span></button>
        <button class="sbtn" id="sk-red"   onclick="buySkin('red',100)"><span class="dot" style="background:#cc2222"></span>Червоний<span class="ptag">(100🪙)</span></button>
      </div>
      <h4>Фони:</h4>
      <div class="btn-row">
        <button class="sbtn" id="bg-day"    onclick="buyBg('day',0)">☀️ День</button>
        <button class="sbtn" id="bg-desert" onclick="buyBg('desert',80)">🏜️ Пустеля<span class="ptag">(80🪙)</span></button>
        <button class="sbtn" id="bg-forest" onclick="buyBg('forest',120)">🌲 Ліс<span class="ptag">(120🪙)</span></button>
      </div>
      <hr style="margin:10px 0;border-color:#eee">
      <strong>Промокод:</strong>
      <div class="promo-row">
        <input id="promoInp" placeholder="Введи код..." onkeydown="if(event.key==='Enter')usePromo()">
        <button id="promoBtn" onclick="usePromo()">Застосувати</button>
        <span id="promoMsg"></span>
      </div>
    </div>
  </div>

  <!-- МЕНЮ -->
  <div class="card" id="menuCard">
    <p class="hint">⬆️ Стрибок &nbsp;|&nbsp; ⬇️ Присісти &nbsp;|&nbsp; Shift — прискорення</p>
    <div class="lvl-row">
      <label><strong>Рівень:</strong>&nbsp;
        <select id="lvlSel">
          <option value="easy">Легкий</option>
          <option value="medium">Середній</option>
          <option value="hard">Складний</option>
        </select>
      </label>
      <button class="btn-play" onclick="startGame()">▶ Грати</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="card" id="goCard">
    <h2 class="go-title">💀 Гру закінчено!</h2>
    <p>Рахунок: <strong id="goScore">0</strong></p>
    <p style="color:#a07000">+<span id="goCoins">0</span> 🪙 монет зароблено</p>
    <div class="go-btns">
      <button class="btn-retry" onclick="startGame()">🔄 Грати ще раз</button>
      <button class="btn-home"  onclick="showMenu()">🏠 Меню</button>
    </div>
  </div>

  <!-- CANVAS -->
  <canvas id="gameCanvas" width="800" height="200"></canvas>
  <div id="scorebar">Рахунок: <span id="scoreLive">0</span></div>

  <!-- МОБІЛЬНІ КНОПКИ -->
  <div id="mob">
    <button class="mbtn" style="background:#6c47ff" ontouchstart="event.preventDefault();jump()" onmousedown="jump()">⬆ Стрибок</button>
    <button class="mbtn" style="background:#555"
      onpointerdown="if(dino)dino.duck=true"
      onpointerup="if(dino)dino.duck=false"
      onpointerleave="if(dino)dino.duck=false">⬇ Присісти</button>
  </div>
</div>

<script>
// ══ КОНСТАНТИ ════════════════════════════════════════════════════════════════
const CW=800,CH=200;
const GY=170;          // поверхня землі
const DH=30;           // висота дино (стоячи)
const DW=26;           // ширина дино
const DY0=GY-DH;       // 140 — y верхнього краю дино на землі
const SPEEDS={easy:4,medium:6,hard:9};
const COLORS={black:"#222",green:"#22aa44",red:"#cc2222"};
const SKINLBL={black:"Чорний",green:"Зелений",red:"Червоний"};
const BGLBL={day:"☀️ День",desert:"🏜️ Пустеля",forest:"🌲 Ліс"};
const ADMIN_CODE="Qz3.yR!7mN?2xP.9qZ5!";
const PROMOS={"7В":100,"Nasklio":9999};
const HB_KEY="hb_"+Math.random().toString(36).slice(2,10);

// ══ СТАН ГРАВЦЯ ══════════════════════════════════════════════════════════════
let coins=ld("coins",0),skin=ld("skin","black"),bg=ld("bg","day");
let ownSkins=ld("ownedSkins",["black"]),ownBgs=ld("ownedBg",["day"]);
let usedPromos=ld("usedPromos",[]),nick=ld("nickname","Гравець");
let pid=localStorage.getItem("playerId")||"";
if(!/^\d+$/.test(pid)){pid=(Date.now()%1000000+"").padStart(6,"0")+(Math.random()*1e4|0+"").padStart(4,"0");localStorage.setItem("playerId",pid);}

function ld(k,d){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d;}catch{return d;}}
function sv(k,v){localStorage.setItem(k,JSON.stringify(v));}

// ══ ВІДВІДУВАННЯ ТА ОНЛАЙН ═══════════════════════════════════════════════════
const visits=(parseInt(localStorage.getItem("totalVisits")||"0"))+1;
localStorage.setItem("totalVisits",String(visits));
function hb(){localStorage.setItem(HB_KEY,String(Date.now()));}
hb(); setInterval(()=>{hb();if(document.getElementById("aOnl"))document.getElementById("aOnl").textContent=online();},5000);
window.addEventListener("beforeunload",()=>localStorage.removeItem(HB_KEY));
function online(){const now=Date.now();let c=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("hb_")&&now-parseInt(localStorage.getItem(k)||"0")<15000)c++;}return Math.max(1,c);}

// ══ CANVAS ═══════════════════════════════════════════════════════════════════
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
canvas.addEventListener("pointerup",()=>jump());

const pc=document.getElementById("previewCanvas");
const pctx=pc.getContext("2d");

// ══ МАЛЮВАННЯ ФОНУ ════════════════════════════════════════════════════════════
function drawBg(c,g,W,H,groundY){
  const skyH=groundY, gndH=H-groundY;
  if(g==="day"){
    c.fillStyle="#d4efff";c.fillRect(0,0,W,skyH);
    c.fillStyle="rgba(255,255,255,0.85)";
    c.beginPath();c.ellipse(140,36,38,16,0,0,Math.PI*2);c.fill();
    c.beginPath();c.ellipse(168,30,26,13,0,0,Math.PI*2);c.fill();
    c.beginPath();c.ellipse(530,50,34,14,0,0,Math.PI*2);c.fill();
    c.beginPath();c.ellipse(558,45,22,11,0,0,Math.PI*2);c.fill();
    c.fillStyle="#7ec850";c.fillRect(0,groundY,W,gndH);
    c.fillStyle="#5da832";c.fillRect(0,groundY+5,W,gndH-5);
    c.fillStyle="#3d8010";c.fillRect(0,groundY,W,3);
  } else if(g==="desert"){
    c.fillStyle="#f9dfa0";c.fillRect(0,0,W,skyH);
    c.fillStyle="#f5a623";c.beginPath();c.arc(710,30,22,0,Math.PI*2);c.fill();
    c.fillStyle="#d4a843";c.fillRect(0,groundY,W,gndH);
    c.fillStyle="#b88c2e";c.fillRect(0,groundY+5,W,gndH-5);
    c.fillStyle="#9a7020";
    for(let i=40;i<W;i+=130){c.fillRect(i,groundY+3,8,3);c.fillRect(i+60,groundY+5,5,2);}
    c.fillStyle="#8b6010";c.fillRect(0,groundY,W,3);
  } else {
    c.fillStyle="#a8d88a";c.fillRect(0,0,W,skyH);
    for(let i=0;i<W;i+=110){
      c.fillStyle="#8b5a2b";c.fillRect(i+3,groundY-52,9,52);
      c.fillStyle="#2e8b57";c.beginPath();c.arc(i+7,groundY-56,22,0,Math.PI*2);c.fill();
    }
    c.fillStyle="#4a9040";c.fillRect(0,groundY,W,gndH);
    c.fillStyle="#357030";c.fillRect(0,groundY+5,W,gndH-5);
    c.fillStyle="#2a5a10";c.fillRect(0,groundY,W,3);
  }
}

// ══ МАЛЮВАННЯ ДИНО ════════════════════════════════════════════════════════════
// dino.y = верхній край. Стоячи: dino.y=DY0=140, низ = 140+30 = 170 = GY ✓
function drawDino(c,d,sk){
  const col=COLORS[sk]||"#222";
  c.fillStyle=col;
  if(d.duck){
    c.fillRect(d.x,     d.y+18, 34,12); // тіло
    c.fillRect(d.x+20,  d.y+10, 14,10); // голова
    c.fillStyle="#fff";c.fillRect(d.x+30,d.y+12,4,4);
    c.fillStyle="#000";c.fillRect(d.x+31,d.y+13,2,2);
  } else {
    c.fillRect(d.x,     d.y+8,  DW,16); // тіло
    c.fillRect(d.x+4,   d.y,    18,12); // голова
    c.fillRect(d.x-4,   d.y+12, 6, 5);  // хвіст
    c.fillRect(d.x+2,   d.y+24, 7, 6);  // ліва нога
    c.fillRect(d.x+13,  d.y+24, 7, 6);  // права нога
    c.fillStyle="#fff";c.fillRect(d.x+16,d.y+2,5,5);
    c.fillStyle="#000";c.fillRect(d.x+17,d.y+3,3,3);
  }
}

// ══ СТРИБОК ══════════════════════════════════════════════════════════════════
function jump(){if(dino&&dino.grounded&&!gameOver&&active){dino.dy=dino.jf;dino.grounded=false;}}

// ══ ІГРОВИЙ СТАН ════════════════════════════════════════════════════════════
let dino,obs,frame,score,gameOver,gameOverAt,raf;
let speed,baseSpeed,running=false,active=false;

// ══ СТАРТ ════════════════════════════════════════════════════════════════════
function startGame(){
  cancelAnimationFrame(raf);
  baseSpeed=SPEEDS[document.getElementById("lvlSel").value]||4;
  speed=baseSpeed; running=false; active=false;
  dino={x:60,y:DY0,dy:0,gravity:.65,jf:-13,grounded:true,duck:false};
  obs=[]; frame=0; score=0; gameOver=false; gameOverAt=0;
  document.getElementById("menuCard").style.display="none";
  document.getElementById("goCard").style.display="none";
  canvas.style.display="block";
  document.getElementById("scorebar").style.display="block";
  document.getElementById("mob").style.display="flex";
  setTimeout(()=>active=true,500);
  raf=requestAnimationFrame(loop);
}

function showMenu(){
  cancelAnimationFrame(raf); active=false;
  canvas.style.display="none";
  document.getElementById("scorebar").style.display="none";
  document.getElementById("mob").style.display="none";
  document.getElementById("goCard").style.display="none";
  document.getElementById("menuCard").style.display="block";
}

// ══ КЛАВІАТУРА ═══════════════════════════════════════════════════════════════
document.addEventListener("keydown",e=>{
  if(!dino)return;
  if((e.key==="ArrowUp"||e.key===" ")&&!gameOver){e.preventDefault();jump();}
  if(e.key==="ArrowDown"){e.preventDefault();if(dino)dino.duck=true;}
  if(e.key==="Shift")running=true;
});
document.addEventListener("keyup",e=>{
  if(!dino)return;
  if(e.key==="ArrowDown")dino.duck=false;
  if(e.key==="Shift")running=false;
});

// ══ ГОЛОВНИЙ ЦИКЛ ════════════════════════════════════════════════════════════
function loop(){
  // ─ Анімація смерті 900мс ─
  if(gameOver){
    const el=Date.now()-gameOverAt;
    drawBg(ctx,bg,CW,CH,GY);
    ctx.fillStyle="#555"; obs.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));
    drawDino(ctx,dino,skin);
    ctx.fillStyle="#333";ctx.font="bold 14px Arial";ctx.textAlign="left";
    ctx.fillText("Рахунок: "+score,10,18);
    const a=Math.min(1,el/350);
    ctx.fillStyle="rgba(0,0,0,"+(a*.5)+")";ctx.fillRect(0,0,CW,CH);
    ctx.globalAlpha=a;
    ctx.fillStyle="#fff";ctx.font="bold 28px Arial";ctx.textAlign="center";
    ctx.fillText("💀 Гру закінчено!",CW/2,CH/2-10);
    ctx.font="bold 15px Arial";
    ctx.fillText("Рахунок: "+score,CW/2,CH/2+18);
    ctx.globalAlpha=1;ctx.textAlign="left";
    if(el>=900){
      document.getElementById("goScore").textContent=score;
      document.getElementById("mob").style.display="none";
      document.getElementById("goCard").style.display="block";
      return;
    }
    raf=requestAnimationFrame(loop);return;
  }

  // ─ Звичайний кадр ─
  frame++;
  dino.y+=dino.dy; dino.dy+=dino.gravity;
  if(dino.y+DH>=GY){dino.y=DY0;dino.dy=0;dino.grounded=true;}

  if(frame>80&&frame%90===0){
    const h=32+Math.floor(Math.random()*16);
    obs.push({x:CW+10,y:GY-h,w:20,h});
  }

  speed=baseSpeed+Math.floor(frame/600)*.5;
  if(running)speed+=3;

  const mg=5;
  for(let i=obs.length-1;i>=0;i--){
    obs[i].x-=speed;
    if(obs[i].x<-60){obs.splice(i,1);continue;}
    const o=obs[i];
    const dh=dino.duck?12:DH, dy2=dino.duck?dino.y+18:dino.y, dw2=dino.duck?34:DW;
    if(dino.x+dw2-mg>o.x+mg&&dino.x+mg<o.x+o.w-mg&&dy2+dh-mg>o.y+mg&&dy2+mg<o.y+o.h-mg){
      gameOver=true;gameOverAt=Date.now();active=false;
      const earned=Math.floor(score/10);
      coins+=earned;sv("coins",coins);refreshUI();
      document.getElementById("goCoins").textContent=earned;
      break;
    }
  }
  score++;document.getElementById("scoreLive").textContent=score;

  drawBg(ctx,bg,CW,CH,GY);
  ctx.fillStyle="#555";obs.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));
  drawDino(ctx,dino,skin);
  ctx.fillStyle="#333";ctx.font="bold 14px Arial";ctx.textAlign="left";
  ctx.fillText("Рахунок: "+score,10,18);
  raf=requestAnimationFrame(loop);
}

// ══ PREVIEW ══════════════════════════════════════════════════════════════════
function drawPreview(){
  const W=200,H=100,gy=68;
  drawBg(pctx,bg,W,H,gy);
  const col=COLORS[skin],dx=28,dy=gy-14;
  pctx.fillStyle=col;
  pctx.fillRect(dx,dy-6,10,8);
  pctx.fillRect(dx+3,dy-10,8,6);
  pctx.fillRect(dx+2,dy+2,3,3);
  pctx.fillRect(dx+6,dy+2,3,3);
  pctx.fillStyle="#fff";pctx.fillRect(dx+8,dy-9,3,3);
  pctx.fillStyle="#000";pctx.fillRect(dx+9,dy-8,2,2);
  document.getElementById("prevLabel").textContent=SKINLBL[skin]+" · "+BGLBL[bg];
}

// ══ UI ═══════════════════════════════════════════════════════════════════════
function refreshUI(){
  document.getElementById("coinsEl").textContent=coins;
  document.getElementById("profCoins").textContent=coins;
  ["black","green","red"].forEach(s=>{
    const b=document.getElementById("sk-"+s);
    b.classList.toggle("on",s===skin);
    const p=b.querySelector(".ptag");if(p)p.style.display=ownSkins.includes(s)?"none":"";
  });
  ["day","desert","forest"].forEach(b=>{
    const el=document.getElementById("bg-"+b);
    el.classList.toggle("on",b===bg);
    const p=el.querySelector(".ptag");if(p)p.style.display=ownBgs.includes(b)?"none":"";
  });
  drawPreview();
}

function init(){
  document.getElementById("nickVal").textContent=nick;
  document.getElementById("pidEl").textContent="#"+pid;
  refreshUI();
}
init();

// ══ ПРОФІЛЬ/МАГАЗИН ПАНЕЛІ ═══════════════════════════════════════════════════
function toggleProfile(){
  document.getElementById("profilePanel").classList.toggle("open");
  document.getElementById("shopPanel").classList.remove("open");
  drawPreview();
}
function toggleShop(){
  document.getElementById("shopPanel").classList.toggle("open");
  document.getElementById("profilePanel").classList.remove("open");
}

// ══ НІК ══════════════════════════════════════════════════════════════════════
function startEditNick(){
  document.getElementById("nickInput").value=nick;
  document.getElementById("nickShow").style.display="none";
  document.getElementById("nickForm").style.display="flex";
  document.getElementById("nickInput").focus();
}
function saveNick(){
  nick=document.getElementById("nickInput").value.trim()||"Гравець";
  sv("nickname",nick);
  document.getElementById("nickVal").textContent=nick;
  document.getElementById("nickShow").style.display="flex";
  document.getElementById("nickForm").style.display="none";
}
function cancelNick(){
  document.getElementById("nickShow").style.display="flex";
  document.getElementById("nickForm").style.display="none";
}

// ══ МАГАЗИН ══════════════════════════════════════════════════════════════════
function buySkin(s,price){
  if(!ownSkins.includes(s)){
    if(coins<price){showPromo("Недостатньо монет!","#cc2222");return;}
    coins-=price;ownSkins.push(s);sv("ownedSkins",ownSkins);sv("coins",coins);
  }
  skin=s;sv("skin",skin);refreshUI();
}
function buyBg(b,price){
  if(!ownBgs.includes(b)){
    if(coins<price){showPromo("Недостатньо монет!","#cc2222");return;}
    coins-=price;ownBgs.push(b);sv("ownedBg",ownBgs);sv("coins",coins);
  }
  bg=b;sv("bg",bg);refreshUI();
}

// ══ ПРОМОКОДИ ════════════════════════════════════════════════════════════════
function usePromo(){
  const code=document.getElementById("promoInp").value.trim();
  if(!code)return;
  if(code===ADMIN_CODE){openAdmin();document.getElementById("promoInp").value="";showPromo("🔑 Адмін-панель відкрита!","#6c47ff");return;}
  if(usedPromos.includes(code)){showPromo("Код вже використано!","#cc2222");return;}
  const bonus=PROMOS[code];
  if(!bonus){showPromo("Невірний код!","#cc2222");return;}
  usedPromos.push(code);sv("usedPromos",usedPromos);
  coins+=bonus;sv("coins",coins);refreshUI();
  showPromo("+"+bonus+" монет! 🎉","#22aa44");
  document.getElementById("promoInp").value="";
}
function showPromo(t,c){
  const e=document.getElementById("promoMsg");e.textContent=t;e.style.color=c;
  setTimeout(()=>e.textContent="",3000);
}

// ══ АДМІН ════════════════════════════════════════════════════════════════════
function openAdmin(){
  document.getElementById("aVis").textContent=visits;
  document.getElementById("aOnl").textContent=online();
  document.getElementById("aId").value=pid;
  document.getElementById("aCoin").value=coins;
  document.getElementById("adminPanel").style.display="block";
}
function closeAdmin(){document.getElementById("adminPanel").style.display="none";}
function adminSaveId(){
  const v=document.getElementById("aId").value.replace(/\D/g,"").slice(0,10).padStart(10,"0");
  localStorage.setItem("playerId",v);pid=v;
  document.getElementById("pidEl").textContent="#"+v;
  document.getElementById("aId").value=v;
}
function adminSaveCoins(){
  const v=Math.max(0,parseInt(document.getElementById("aCoin").value)||0);
  coins=v;sv("coins",coins);refreshUI();
  document.getElementById("aCoin").value=v;
}
